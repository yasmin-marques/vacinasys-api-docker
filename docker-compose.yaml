version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vacinasys-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongo
      - minio

  mongo:
    image: mongo:8

    container_name: vacinasys-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    env_file:
      - .env

  minio:
    image: minio/minio

    container_name: vacinasys-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    env_file:
      - .env

volumes:
  mongo-data:
  minio-data: