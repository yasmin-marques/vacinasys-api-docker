[project]
name = "vacinasys"
version = "0.1.0"
description = "API Web para gerenciamento de sistema de vacinação com FastAPI, MongoDB e Beanie."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "beanie>=1.26.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "fastapi-pagination>=0.12.31",
    "faker>=26.0.0",
    "minio>=7.2.8",
    "python-multipart>=0.0.9",
    "aioboto3>=15.5.0",
    "sqlmodel>=0.0.39",
]
